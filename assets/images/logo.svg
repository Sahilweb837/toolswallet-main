<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 48" fill="none">
  <defs>
    <linearGradient id="tw-orange-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A00" />
      <stop offset="50%" stop-color="#FF5400" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <linearGradient id="tw-text-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A00" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <linearGradient id="tw-shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <filter id="tw-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#FF5400" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Logo Mark Icon -->
  <g filter="url(#tw-glow)">
    <!-- Base Rounded Square -->
    <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#tw-orange-grad)" />
    <!-- Gloss Shine Highlight -->
    <path d="M2 14C2 7.373 7.373 2 14 2H34C40.627 2 46 7.373 46 14V22C34 20 14 20 2 24V14Z" fill="url(#tw-shine)" />

    <!-- Wallet Body Silhouette -->
    <rect x="10" y="13" width="28" height="22" rx="4.5" fill="#FFFFFF" fill-opacity="0.96" />
    
    <!-- Wallet Flap Pocket -->
    <path d="M10 17C10 14.5 12 13 15 13H33C36 13 38 14.5 38 17V20C34 18.5 28 18 24 18C20 18 14 18.5 10 20V17Z" fill="#FFF3EB" />
    
    <!-- Wallet Card / Tool Tab popping out -->
    <path d="M16 9C16 8.44772 16.4477 8 17 8H31C31.5523 8 32 8.44772 32 9V13H16V9Z" fill="#FFE2D1" />
    
    <!-- Central Tool Clasp / Spark (Lightning / Wrench facet) -->
    <rect x="26" y="21" width="13" height="8" rx="3" fill="url(#tw-orange-grad)" />
    <circle cx="30" cy="25" r="1.6" fill="#FFFFFF" />
    
    <!-- Lightning / Spark Icon on Wallet Body -->
    <path d="M19 19L15 25H19L17 30L23 23H19L21 19H19Z" fill="#EA580C" />
  </g>

  <!-- Typography: ToolsWallet -->
  <text x="56" y="32" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" fill="currentColor" letter-spacing="-0.5">Tools</text>
  <text x="122" y="32" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" fill="url(#tw-text-grad)" letter-spacing="-0.5">Wallet</text>
  
  <!-- Sub-Badge .ONLINE / PRO -->
  <rect x="180" y="10" width="16" height="8" rx="4" fill="#FF5400" fill-opacity="0.15" />
  <circle cx="188" cy="14" r="2" fill="#FF5400" />
</svg>
